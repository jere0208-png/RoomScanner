# Premier lancement, données effacées : connexion, question de l'usage
# (plus de film à l'ouverture, demande du patron), puis l'accueil. Ne tourne qu'une fois (thème clair).
appId: ${APP_ID}
name: Premier lancement
---
- launchApp:
    clearState: true
- runFlow: commun/attendre-demarrage.yaml
- waitForAnimationToEnd:
    timeout: 5000

- runFlow:
    when:
      visible: "Découvrir sans compte"
    commands:
      - takeScreenshot: ${THEME}-01-connexion
      - tapOn: "Découvrir sans compte"
      - waitForAnimationToEnd:
          timeout: 5000

- runFlow:
    when:
      visible: "Passer la question"
    commands:
      - takeScreenshot: ${THEME}-04-question-usage
      - tapOn: "Mesurer et aménager"
      - waitForAnimationToEnd:
          timeout: 5000

- runFlow: commun/fenetres-systeme.yaml
- extendedWaitUntil:
    visible: "Voir un exemple"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${THEME}-05-accueil
