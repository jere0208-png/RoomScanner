# La visite 3D, lampes éteintes puis allumées — relevé du patron : « fais des
# screens de quatre propositions, lumières allumées et non allumées ». Le
# rendu C a été retenu ; les captures suivent ses réglages.
appId: ${APP_ID}
name: Visite — éteinte et allumée
---
- launchApp
- runFlow: commun/vers-accueil.yaml
# Les lampes de l'exemple n'existent qu'en mode Électricité.
- tapOn: "Mon compte"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Mode Électricité"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "interrupteur-electricite"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: commun/ouvrir-exemple.yaml
- tapOn: "Explorer"
- extendedWaitUntil:
    visible:
      id: "tout-allumer"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
# Vers le séjour meublé : on tourne le regard (pouce droit), ce qui retire
# aussi la consigne du premier pas.
- swipe:
    start: "85%,60%"
    end: "55%,60%"
    duration: 900
- waitForAnimationToEnd:
    timeout: 5000

# Le rendu retenu (C, « Chaleureux du soir »), lampes éteintes puis allumées.
- takeScreenshot: ${THEME}-60-visite-eteinte
- tapOn:
    id: "tout-allumer"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${THEME}-61-visite-allumee
- tapOn:
    id: "tout-allumer"

# Retour au grand public pour les parcours suivants.
- tapOn: "Terminer"
- launchApp
- runFlow: commun/vers-accueil.yaml
- tapOn: "Mon compte"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Mode Électricité"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "interrupteur-electricite"
