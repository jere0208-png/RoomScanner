# La visite 3D, telle qu'on la voit — relevé du patron : « supprime la
# possibilité d'éclairer la pièce en appuyant sur le bouton lors de la
# visite ». Plus de lampes à allumer : une seule capture, à l'éclairage de
# base de la pièce.
appId: ${APP_ID}
name: Visite
---
- launchApp
- runFlow: commun/vers-accueil.yaml
# Les luminaires de l'exemple n'existent qu'en mode Électricité.
- tapOn: "Mon compte"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Mode Électricité"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "interrupteur-electricite"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: commun/ouvrir-exemple.yaml
- tapOn: "Explorer"
- extendedWaitUntil:
    # Le bouton s'annonce « Terminer l’exploration » à VoiceOver.
    visible: "Terminer.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
# Vers le séjour meublé : on tourne le regard (pouce droit), ce qui retire
# aussi la consigne du premier pas.
- swipe:
    start: "85%,60%"
    end: "55%,60%"
    duration: 900
- waitForAnimationToEnd:
    timeout: 5000

- takeScreenshot: ${THEME}-60-visite

# Retour au grand public pour les parcours suivants.
- tapOn: "Terminer.*"
- launchApp
- runFlow: commun/vers-accueil.yaml
- tapOn: "Mon compte"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Mode Électricité"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "interrupteur-electricite"
