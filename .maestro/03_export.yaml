# L'export : la feuille des formats, puis l'écran du dossier PDF.
appId: ${APP_ID}
name: Export
---
- launchApp
- runFlow: commun/ouvrir-exemple.yaml
- tapOn: "Exporter ou imprimer le plan"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${THEME}-20-export-formats
# Dans la feuille « Exporter » (modale : touchée à sa place) : la carte
# « Plan PDF », la deuxième, sous « Image du plan ».
- tapOn:
    point: "35%,82%"
- extendedWaitUntil:
    visible: "Page de garde"
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${THEME}-22-export-pdf
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${THEME}-23-export-pdf-suite
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${THEME}-24-export-pdf-fin
