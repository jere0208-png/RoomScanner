# L'export : la feuille des formats, puis l'écran du dossier PDF.
appId: ${APP_ID}
name: Export
---
- launchApp
- runFlow: commun/ouvrir-exemple.yaml
- tapOn: "Exporter"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${THEME}-20-export-formats
# Dans la feuille « Exporter » (modale : touchée à sa place).
- tapOn:
    point: "50%,64%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${THEME}-21-export-autres-formats
# On referme (le fond, au-dessus de la feuille), on rouvre, puis le PDF.
- tapOn:
    point: "50%,22%"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Exporter"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "35%,54%"
- extendedWaitUntil:
    visible: "Page de garde"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${THEME}-22-export-pdf
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${THEME}-23-export-pdf-suite
- scroll
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${THEME}-24-export-pdf-fin
