# L'appartement d'exemple : plan 2D, mode édition, menu du plan, vue 3D.
appId: ${APP_ID}
name: Plan d'exemple
---
- launchApp
- runFlow: commun/vers-accueil.yaml
- takeScreenshot: ${THEME}-10-accueil
- runFlow: commun/ouvrir-exemple.yaml
- takeScreenshot: ${THEME}-11-plan-2d

# Le mode édition : la rangée d'outils change de contenu.
- tapOn:
    text: "Édition"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${THEME}-12-plan-2d-edition
- tapOn:
    text: "Édition"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Le menu « ⋯ » du plan.
- tapOn:
    text: "Plus"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${THEME}-13-menu-du-plan
# La feuille se ferme en la tirant vers le bas (Maestro ne lit pas
# l'intérieur des fenêtres modales de React Native, et sa croix a bougé).
- swipe:
    start: "50%,12%"
    end: "50%,95%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 5000

# La maquette 3D.
# La pastille de vue s'appelle par ce qu'elle montre : « 2D, passer en 3D ».
- tapOn: "2D, passer en 3D"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${THEME}-14-vue-3d
- swipe:
    direction: LEFT
    duration: 600
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${THEME}-15-vue-3d-tournee
- tapOn:
    text: "3D, passer en 2D"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# La feuille « Décorer » (en dernier : rien ne dépend de sa fermeture).
- tapOn:
    text: "Décorer"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${THEME}-16-decorer
- swipe:
    start: "50%,85%"
    end: "50%,45%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${THEME}-17-decorer-bas
