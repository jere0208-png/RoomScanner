apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace 'com.roomscan'
  compileSdkVersion safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    // SceneView 2.x exige minSdk 28 ; les appareils ARCore récents sont tous au-dessus.
    minSdkVersion 28
    targetSdkVersion safeExtGet('targetSdkVersion', 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // Substituée par react-android via le plugin gradle de RN.
  implementation 'com.facebook.react:react-native:+'
  implementation 'com.google.ar:core:1.45.0'
  // Rendu caméra AR (Filament) sans boilerplate OpenGL.
  implementation 'io.github.sceneview:arsceneview:2.2.1'
}
