; EchoPlan — réglages PHP du dossier de l'API (lus par PHP-FPM / CGI).
; Le diagnostic envoie une tranche de vidéo d'au plus 25 Mo, et la première
; requête porte aussi le journal (20 Mo au plus) : sans ces réglages, PHP
; refuse la vidéo (2 Mo par défaut) ou jette toute la requête.
upload_max_filesize = 32M
post_max_size = 64M
display_errors = Off
