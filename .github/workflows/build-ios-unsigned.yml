# Compile une version iOS NON SIGNÉE sur les Mac gratuits de GitHub Actions.
# L'IPA produit se signe ensuite sur le PC avec Sideloadly ou AltStore
# (compte Apple gratuit, validité 7 jours, iPhone branché en USB).
name: iOS unsigned build

on:
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances JS
        run: npm ci

      - name: Installer CocoaPods et les pods
        run: |
          bundle install
          cd ios && bundle exec pod install

      - name: Compiler (Release, sans signature)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace RoomScanner.xcworkspace \
            -scheme RoomScanner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaqueter l'IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RoomScanner.app Payload/
          zip -qry RoomScanner-unsigned.ipa Payload

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: RoomScanner-unsigned-ipa
          path: ios/RoomScanner-unsigned.ipa
          retention-days: 14
